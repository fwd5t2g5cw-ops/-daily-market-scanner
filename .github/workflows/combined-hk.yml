name: 🇭🇰 Hong Kong Combined Scanner
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - run: python combined_market_scanner.py --market hkex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-combined-results-${{ github.run_number }}
          path: combined_results/hkex/
          retention-days: 30
