name: 🧱 Build US $1B+ Universe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas yfinance
      - name: Build US market-cap universe
        run: python build_us_1b_universe.py --min-market-cap 1000000000
      - name: Show universe size
        run: |
          echo "US $1B+ symbols: $(wc -l < data/us_1b_universe.txt)"
          head -20 data/us_1b_universe.csv
      - name: Commit refreshed universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_1b_universe.txt data/us_1b_universe.csv
          if git diff --cached --quiet; then
            echo "Universe unchanged"
          else
            git commit -m "Refresh US $1B+ universe"
            git push
          fi
      - name: Upload universe artifact
        uses: actions/upload-artifact@v4
        with:
          name: us-1b-universe
          path: |
            data/us_1b_universe.txt
            data/us_1b_universe.csv
          retention-days: 90
