name: 🇨🇦 Canada Double Reclaim Scanner

on:
  workflow_dispatch:
  schedule:
    # 3:00 PM Toronto (one hour before TSX close), DST-safe pair
    - cron: '0 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    # 6:00 PM Toronto, DST-safe pair
    - cron: '0 22 * * 1-5'
    - cron: '0 23 * * 1-5'

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gate scheduled runs to 3PM or 6PM Toronto
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/Toronto'))
          if not (now.weekday() < 5 and now.hour in (15, 18) and now.minute <= 45):
              raise SystemExit('Outside 3PM/6PM Toronto scan window; skip duplicate DST cron')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl

      - name: Run Canada Double Reclaim scanner
        run: python canada_double_reclaim_scanner.py

      - name: Run exact TradingView Pine ENTRY scanner
        run: python pine_entry_scanner.py --market canada

      - name: Run PRE-ENTRY setup watch
        run: python pre_entry_scanner.py --market canada

      - name: Merge ENTRY, Double Reclaim, Reclaim Breakout and candle patterns
        run: python merge_signal_candles.py --market canada

      - name: Publish latest Canada results
        if: success()
        run: |
          rm -rf latest/canada
          mkdir -p latest/canada
          cp -a double_reclaim_results/canada/. latest/canada/
          printf 'run_id=%s\nrun_number=%s\ncommit=%s\nupdated_utc=%s\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.sha }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest/canada/LATEST_RUN.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A latest/canada
          if git diff --cached --quiet; then
            echo 'Latest Canada results unchanged; nothing to commit.'
          else
            git commit -m "Update latest Canada scanner results [skip ci]"
            git push
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canada-double-reclaim-${{ github.run_number }}
          path: double_reclaim_results/canada/
          retention-days: 30
