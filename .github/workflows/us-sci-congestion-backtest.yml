name: 🧱 US SCI-Style Congestion Backtest

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl

      - name: Run SCI-style congestion reclaim backtest
        run: python us_sci_congestion_backtest.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-sci-congestion-backtest-${{ github.run_number }}
          path: backtest_us_sci_congestion_results/
          retention-days: 30
