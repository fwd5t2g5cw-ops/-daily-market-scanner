name: Pre-Gap Older Holdout Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_pre_gap_oos.py'
      - '.github/workflows/research-pre-gap-oos.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python research_pre_gap_oos.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/pre_gap_oos
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update older pre-gap holdout research [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
