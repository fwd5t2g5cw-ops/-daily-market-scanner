name: 🇨🇦 Canada Combined Scanner
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - run: python combined_market_scanner.py --market tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canada-combined-results-${{ github.run_number }}
          path: combined_results/tsx/
          retention-days: 30
