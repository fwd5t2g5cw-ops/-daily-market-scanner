name: Dual Fib price charts

on:
  push:
    branches: [main]
    paths:
      - generate_dual_fib_price_charts.py
      - selected_20_price_chart_cases.csv
      - .github/workflows/dual-fib-price-charts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy matplotlib yfinance
      - name: Build twenty daily OHLC charts
        run: python generate_dual_fib_price_charts.py
      - name: Upload chart package
        uses: actions/upload-artifact@v4
        with:
          name: dual-fib-price-charts-20
          path: price_charts_20/
          if-no-files-found: error
      - name: Commit generated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_charts_20
          git diff --cached --quiet && exit 0
          git commit -m "Generate 20 dual Fib price charts"
          git push
