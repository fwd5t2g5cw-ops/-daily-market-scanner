name: Breakout Buildup Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - breakout-buildup-playbook-v1
    paths:
      - 'breakout_buildup_backtest.py'
      - '.github/workflows/breakout-buildup-backtest.yml'
      - 'data/us_1b_universe.txt'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run 5-year US backtest
        run: |
          python breakout_buildup_backtest.py \
            --symbols data/us_1b_universe.txt \
            --period 5y \
            --output-dir backtest_output \
            --same-bar-policy conservative

      - name: Show summary
        if: always()
        run: |
          if [ -f backtest_output/summary.json ]; then
            cat backtest_output/summary.json
          fi
          if [ -f backtest_output/yearly.csv ]; then
            echo '--- yearly ---'
            cat backtest_output/yearly.csv
          fi

      - name: Upload backtest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakout-buildup-backtest-${{ github.run_number }}
          path: backtest_output/
          if-no-files-found: warn
