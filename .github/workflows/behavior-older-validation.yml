name: Older Behavior Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_behavior_older_validation.py'
      - '.github/workflows/behavior-older-validation.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python research_behavior_older_validation.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/behavior_older_validation
          git diff --cached --quiet && exit 0
          git commit -m 'Update older behavior validation [skip ci]'
          git pull --rebase origin main
          git push
