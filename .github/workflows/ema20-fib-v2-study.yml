name: EMA20 Fib 0.236 V2 Study

on:
  workflow_dispatch:
  push:
    branches:
      - breakout-buildup-playbook-v1
    paths:
      - 'ema20_fib0236_v2_study.py'
      - '.github/workflows/ema20-fib-v2-study.yml'

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run tightened 5-year US study
        run: |
          python ema20_fib0236_v2_study.py \
            --symbols data/us_1b_universe.txt \
            --period 5y \
            --output-dir ema20_fib_v2_output

      - name: Show summary
        run: cat ema20_fib_v2_output/summary.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ema20-fib-v2-${{ github.run_number }}
          path: ema20_fib_v2_output/
