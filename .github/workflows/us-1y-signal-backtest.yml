name: 🧪 US 1Y Signal Backtest

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl

      - name: Run one-year US signal backtest
        run: python us_1y_signal_backtest.py

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-1y-signal-backtest-${{ github.run_number }}
          path: backtest_us_1y_results/
          retention-days: 30
