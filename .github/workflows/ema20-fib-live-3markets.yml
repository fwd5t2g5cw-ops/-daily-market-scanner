name: EMA20 Fib 0.236 Live 3 Markets
on:
  workflow_dispatch:
  schedule:
    # 7 PM Toronto is 23:00 UTC during EDT and 00:00 UTC during EST.
    # Schedule both candidates and gate inside the first step.
    - cron: '0 23 * * 1-5'
    - cron: '0 0 * * 2-6'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check Toronto schedule
        id: schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: proceeding."
            exit 0
          fi

          TORONTO_HOUR=$(TZ=America/Toronto date +%H)
          TORONTO_DOW=$(TZ=America/Toronto date +%u)
          echo "Toronto local time: $(TZ=America/Toronto date)"

          if [ "$TORONTO_HOUR" = "19" ] && [ "$TORONTO_DOW" -ge 1 ] && [ "$TORONTO_DOW" -le 5 ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            echo "7 PM Toronto weekday: proceeding."
          else
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "Not 7 PM Toronto weekday: skipping duplicate DST schedule."
          fi

      - uses: actions/checkout@v4
        if: steps.schedule_gate.outputs.run_scan == 'true'

      - uses: actions/setup-python@v5
        if: steps.schedule_gate.outputs.run_scan == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.schedule_gate.outputs.run_scan == 'true'
        run: pip install -r requirements.txt openpyxl

      - name: Build universes
        if: steps.schedule_gate.outputs.run_scan == 'true'
        run: |
          python build_us_1b_universe.py --min-market-cap 1000000000
          python build_universes.py --markets tsx,hk

      - name: Scan US
        if: steps.schedule_gate.outputs.run_scan == 'true'
        run: python ema20_fib0236_live_scanner.py --symbols data/us_1b_universe.txt --output ema20_fib_live_results/us/results.csv

      - name: Scan Canada TSX
        if: steps.schedule_gate.outputs.run_scan == 'true'
        run: python ema20_fib0236_live_scanner.py --symbols data/tsx_universe.txt --output ema20_fib_live_results/canada/results.csv

      - name: Scan Hong Kong
        if: steps.schedule_gate.outputs.run_scan == 'true'
        run: python ema20_fib0236_live_scanner.py --symbols data/hk_universe.txt --output ema20_fib_live_results/hk/results.csv

      - uses: actions/upload-artifact@v4
        if: always() && steps.schedule_gate.outputs.run_scan == 'true'
        with:
          name: ema20-fib-live-3markets-${{ github.run_number }}
          path: ema20_fib_live_results/
          retention-days: 30
