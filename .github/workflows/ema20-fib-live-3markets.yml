name: EMA20 Fib 0.236 Live 3 Markets
on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Run at both possible 7 PM Toronto UTC times,
    # then gate the job so DST/EST changes still produce one run at 7 PM.
    - cron: '0 23 * * 1-5'
    - cron: '0 0 * * 2-6'

jobs:
  scan:
    # Manual dispatch always runs. Scheduled runs proceed only when
    # Toronto local time is 19:00 on a weekday.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && format('{0:HH}', fromJSON(steps.toronto-time.outputs.result)) == '19') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check Toronto local time
        id: toronto-time
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            return new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/Toronto',
              hour: '2-digit',
              hour12: false
            }).format(new Date());

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - name: Build universes
        run: |
          python build_us_1b_universe.py --min-market-cap 1000000000
          python build_universes.py --markets tsx,hk
      - name: Scan US
        run: python ema20_fib0236_live_scanner.py --symbols data/us_1b_universe.txt --output ema20_fib_live_results/us/results.csv
      - name: Scan Canada TSX
        run: python ema20_fib0236_live_scanner.py --symbols data/tsx_universe.txt --output ema20_fib_live_results/canada/results.csv
      - name: Scan Hong Kong
        run: python ema20_fib0236_live_scanner.py --symbols data/hk_universe.txt --output ema20_fib_live_results/hk/results.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ema20-fib-live-3markets-${{ github.run_number }}
          path: ema20_fib_live_results/
          retention-days: 30
