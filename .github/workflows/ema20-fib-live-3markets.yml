name: EMA20 Fib 0.236 Live 3 Markets
on:
  workflow_dispatch:
  schedule:
    # 7 PM Toronto, DST-safe pair
    - cron: '0 23 * * 1-5'
    - cron: '0 0 * * 2-6'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Gate scheduled runs without failing delayed cron jobs
        id: gate
        shell: bash
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=$(TZ=America/Toronto date +%z)
          case "$TRIGGER_CRON:$OFFSET" in
            "0 23 * * 1-5:-0400"|"0 0 * * 2-6:-0500")
              echo "run_scan=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run_scan=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate DST cron: trigger=$TRIGGER_CRON Toronto_offset=$OFFSET"
              ;;
          esac

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run_scan == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run_scan == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run_scan == 'true'
        run: pip install -r requirements.txt openpyxl

      - name: Build universes
        if: steps.gate.outputs.run_scan == 'true'
        run: |
          python build_us_1b_universe.py --min-market-cap 1000000000
          python build_universes.py --markets tsx,hk

      - name: Scan US
        if: steps.gate.outputs.run_scan == 'true'
        run: python ema20_fib0236_live_scanner.py --symbols data/us_1b_universe.txt --output ema20_fib_live_results/us/results.csv

      - name: Scan Canada TSX
        if: steps.gate.outputs.run_scan == 'true'
        run: python ema20_fib0236_live_scanner.py --symbols data/tsx_universe.txt --output ema20_fib_live_results/canada/results.csv

      - name: Scan Hong Kong
        if: steps.gate.outputs.run_scan == 'true'
        run: python ema20_fib0236_live_scanner.py --symbols data/hk_universe.txt --output ema20_fib_live_results/hk/results.csv

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run_scan == 'true' && always()
        with:
          name: ema20-fib-live-3markets-${{ github.run_number }}
          path: ema20_fib_live_results/
          retention-days: 30
