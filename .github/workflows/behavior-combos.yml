name: Behavior Combination Forward Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_behavior_combos.py'
      - '.github/workflows/behavior-combos.yml'
      - 'research/accumulation_behavior/stock_days.csv'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python research_behavior_combos.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/behavior_combos
          git diff --cached --quiet && exit 0
          git commit -m 'Update behavior combination research [skip ci]'
          git pull --rebase origin main
          git push
