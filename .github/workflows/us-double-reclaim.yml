name: 🇺🇸 US Double Reclaim Scanner

on:
  workflow_dispatch:
  schedule:
    # 3:00 PM Toronto (one hour before NYSE/Nasdaq close), DST-safe pair
    - cron: '0 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    # 6:00 PM Toronto, DST-safe pair
    - cron: '0 22 * * 1-5'
    - cron: '0 23 * * 1-5'

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gate scheduled runs to 3PM or 6PM Toronto
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/Toronto'))
          if not (now.weekday() < 5 and now.hour in (15, 18) and now.minute <= 45):
              raise SystemExit('Outside 3PM/6PM Toronto scan window; skip duplicate DST cron')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl

      - name: Run US $1B+ Double Reclaim scanner
        run: python us_double_reclaim_scanner.py

      - name: Run exact TradingView Pine ENTRY scanner
        run: python pine_entry_scanner.py --market us

      - name: Run PRE-ENTRY setup watch
        run: python pre_entry_scanner.py --market us

      - name: Merge ENTRY, Double Reclaim, Reclaim Breakout and candle patterns
        run: python merge_signal_candles.py --market us

      - name: Publish latest US results
        if: success()
        run: |
          rm -rf latest/us
          mkdir -p latest/us
          cp -a double_reclaim_results/us/. latest/us/
          printf 'run_id=%s\nrun_number=%s\ncommit=%s\nupdated_utc=%s\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.sha }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest/us/LATEST_RUN.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A latest/us
          if git diff --cached --quiet; then
            echo 'Latest US results unchanged; nothing to commit.'
          else
            git commit -m "Update latest US scanner results [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-double-reclaim-${{ github.run_number }}
          path: double_reclaim_results/us/
          retention-days: 30
