name: 🇺🇸 US Double Reclaim Scanner

on:
  workflow_dispatch:
  schedule:
    # 3:00 PM Toronto (one hour before NYSE/Nasdaq close), DST-safe pair
    - cron: '0 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    # 6:00 PM Toronto, DST-safe pair
    - cron: '0 22 * * 1-5'
    - cron: '0 23 * * 1-5'

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gate scheduled runs to 3PM or 6PM Toronto
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/Toronto'))
          if not (now.weekday() < 5 and now.hour in (15, 18) and now.minute <= 10):
              raise SystemExit('Outside 3PM/6PM Toronto scan window; skip duplicate DST cron')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl

      - name: Run US $1B+ Double Reclaim scanner
        run: python us_double_reclaim_scanner.py

      - name: Run exact TradingView Pine ENTRY scanner
        run: python pine_entry_scanner.py --market us

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-double-reclaim-${{ github.run_number }}
          path: double_reclaim_results/us/
          retention-days: 30
