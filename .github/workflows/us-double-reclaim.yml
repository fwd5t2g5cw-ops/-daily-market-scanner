name: 🇺🇸 US Double Reclaim Scanner

on:
  workflow_dispatch:
  schedule:
    # 3:00 PM Toronto, DST-safe pair
    - cron: '0 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    # 6:00 PM Toronto, DST-safe pair
    - cron: '0 22 * * 1-5'
    - cron: '0 23 * * 1-5'

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gate scheduled runs without failing delayed cron jobs
        id: gate
        shell: bash
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=$(TZ=America/Toronto date +%z)
          case "$TRIGGER_CRON:$OFFSET" in
            "0 19 * * 1-5:-0400"|"0 20 * * 1-5:-0500"|"0 22 * * 1-5:-0400"|"0 23 * * 1-5:-0500")
              echo "run_scan=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run_scan=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate DST cron: trigger=$TRIGGER_CRON Toronto_offset=$OFFSET"
              ;;
          esac

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run_scan == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run_scan == 'true'
        run: pip install -r requirements.txt openpyxl

      - name: Run US $1B+ Double Reclaim scanner
        if: steps.gate.outputs.run_scan == 'true'
        run: python us_double_reclaim_scanner.py

      - name: Run exact TradingView Pine ENTRY scanner
        if: steps.gate.outputs.run_scan == 'true'
        run: python pine_entry_scanner.py --market us

      - name: Run PRE-ENTRY setup watch
        if: steps.gate.outputs.run_scan == 'true'
        run: python pre_entry_scanner.py --market us

      - name: Merge ENTRY, Double Reclaim, Reclaim Breakout and candle patterns
        if: steps.gate.outputs.run_scan == 'true'
        run: python merge_signal_candles.py --market us

      - name: Publish latest US results
        if: steps.gate.outputs.run_scan == 'true' && success()
        run: |
          rm -rf latest/us
          mkdir -p latest/us
          cp -a double_reclaim_results/us/. latest/us/
          printf 'run_id=%s\nrun_number=%s\ncommit=%s\nupdated_utc=%s\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.sha }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest/us/LATEST_RUN.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A latest/us
          if git diff --cached --quiet; then
            echo 'Latest US results unchanged; nothing to commit.'
          else
            git commit -m "Update latest US scanner results [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run_scan == 'true' && always()
        with:
          name: us-double-reclaim-${{ github.run_number }}
          path: double_reclaim_results/us/
          retention-days: 30
