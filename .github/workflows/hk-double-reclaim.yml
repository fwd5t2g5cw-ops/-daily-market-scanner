name: 🇭🇰 HK Double Reclaim Scanner

on:
  workflow_dispatch:
  schedule:
    # 3:00 PM Hong Kong (one hour before HKEX close)
    - cron: '0 7 * * 1-5'
    # 6:00 PM Toronto, DST-safe pair
    - cron: '0 22 * * 1-5'
    - cron: '0 23 * * 1-5'

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gate scheduled runs to HK 3PM or Toronto 6PM
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          hk = datetime.now(ZoneInfo('Asia/Hong_Kong'))
          tor = datetime.now(ZoneInfo('America/Toronto'))
          hk_preclose = hk.weekday() < 5 and hk.hour == 15 and hk.minute <= 45
          tor_evening = tor.weekday() < 5 and tor.hour == 18 and tor.minute <= 45
          if not (hk_preclose or tor_evening):
              raise SystemExit('Outside HK 3PM / Toronto 6PM scan window; skip duplicate DST cron')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl

      - name: Run fast HK Double Reclaim scanner
        run: python hk_double_reclaim_scanner.py

      - name: Run exact TradingView Pine ENTRY scanner
        run: python pine_entry_scanner.py --market hk

      - name: Run PRE-ENTRY setup watch
        run: python pre_entry_scanner.py --market hk

      - name: Merge ENTRY, Double Reclaim, Reclaim Breakout and candle patterns
        run: python merge_signal_candles.py --market hk

      - name: Publish latest HK results
        if: success()
        run: |
          rm -rf latest/hk
          mkdir -p latest/hk
          cp -a double_reclaim_results/hk/. latest/hk/
          printf 'run_id=%s\nrun_number=%s\ncommit=%s\nupdated_utc=%s\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.sha }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest/hk/LATEST_RUN.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A latest/hk
          if git diff --cached --quiet; then
            echo 'Latest HK results unchanged; nothing to commit.'
          else
            git commit -m "Update latest HK scanner results [skip ci]"
            git push
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-double-reclaim-${{ github.run_number }}
          path: double_reclaim_results/hk/
          retention-days: 30
