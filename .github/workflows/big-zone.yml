name: Big Zone Scanner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['big_zone_scanner.py','build_universes.py','.github/workflows/big-zone.yml']
  schedule:
    - cron: '30 22 * * 1-5'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - run: python build_universes.py --markets us,tsx,hk
      - name: Run Big Zone US + TSX + HK
        run: python big_zone_scanner.py --us-file data/us_universe.txt --tsx-file data/tsx_universe.txt --hk-file data/hk_universe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-zone-results-${{ github.run_number }}
          path: big_zone_results/
          retention-days: 30
