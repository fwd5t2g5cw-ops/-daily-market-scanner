name: Big Zone Scanner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['big_zone_scanner.py','build_universes.py','.github/workflows/big-zone.yml']
  schedule:
    - cron: '30 22 * * 1-5'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - name: Build TSX universe only
        run: python build_universes.py --markets tsx
      - name: Run Big Zone Canada TSX only
        run: python big_zone_scanner.py --tsx-file data/tsx_universe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-zone-canada-results-${{ github.run_number }}
          path: big_zone_results/
          retention-days: 30
