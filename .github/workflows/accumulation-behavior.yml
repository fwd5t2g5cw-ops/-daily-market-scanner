name: Accumulation Behavior Pre-Gap Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_accumulation_behavior.py'
      - '.github/workflows/accumulation-behavior.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python research_accumulation_behavior.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/accumulation_behavior
          git diff --cached --quiet && exit 0
          git commit -m 'Update accumulation behavior research [skip ci]'
          git pull --rebase origin main
          git push
