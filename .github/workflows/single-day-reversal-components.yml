name: Single-Day Reversal Components
on:
  workflow_dispatch:
  push:
    paths:
      - 'research_single_day_reversal_components.py'
      - '.github/workflows/single-day-reversal-components.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python research_single_day_reversal_components.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/single_day_reversal_components
          git diff --cached --quiet && exit 0
          git commit -m 'Update reversal component analysis [skip ci]'
          git pull --rebase origin main
          git push
