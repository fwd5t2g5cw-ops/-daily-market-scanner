name: 🌏 Historical 3-Market Reclaim

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy yfinance requests openpyxl
      - name: Scan US TSX HK from Aug 3 to Aug 14
        run: python historical_3market_reclaim.py --start 2026-08-03 --end 2026-08-14 --markets us,tsx,hk
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: historical-3market-reclaim-2026-08-03-to-08-14
          path: historical_3market_results/
          retention-days: 90
