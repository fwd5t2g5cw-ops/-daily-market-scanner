name: Reversal R Multiple Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_reversal_rr.py'
      - '.github/workflows/reversal-rr.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python research_reversal_rr.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/reversal_rr
          git diff --cached --quiet && exit 0
          git commit -m 'Update reversal R-multiple validation [skip ci]'
          git pull --rebase origin main
          git push
