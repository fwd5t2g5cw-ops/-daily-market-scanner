name: Power Gap OOS Research

on:
  push:
    paths:
      - 'research_power_gap_oos.py'
      - 'research/pre_gap_oos/events.csv'
      - '.github/workflows/power-gap-oos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python research_power_gap_oos.py
      - name: Commit research output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/power_gap_oos
          git diff --cached --quiet || git commit -m 'Update Power Gap OOS research [skip ci]'
          git pull --rebase origin main
          git push
