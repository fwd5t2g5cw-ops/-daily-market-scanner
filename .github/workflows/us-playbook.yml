name: US Daily Playbook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scanner.py','.github/workflows/us-playbook.yml']
  schedule:
    - cron: '0 18 * * 1-5'
      timezone: 'America/Toronto'
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - name: Previous artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/us-playbook.yml/runs?status=success&per_page=10" --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' | head -1)
          if [ -n "$RUN_ID" ]; then
            ART_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("us-playbook-results-")) | .id' | head -1)
            if [ -n "$ART_ID" ]; then gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > previous.zip; unzip -q previous.zip -d previous; fi
          fi
      - name: Run US Playbook + VCP
        run: python scanner.py --min-score 1 --min-rs 70
      - run: python mark_new_signals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-playbook-results-${{ github.run_number }}
          path: output/
          retention-days: 30
