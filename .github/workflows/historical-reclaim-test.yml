name: 🧪 Historical Reclaim Test

on:
  workflow_dispatch:

jobs:
  reclaim-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy yfinance requests openpyxl
      - name: Scan US reclaim signals for Aug 4-7
        run: python historical_reclaim_test.py --dates 2026-08-04,2026-08-05,2026-08-06,2026-08-07
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: historical-reclaim-test-2026-08-04-to-08-07
          path: reclaim_test_results/
          retention-days: 90
